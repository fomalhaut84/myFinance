name: Deploy on Release

# 운영 배포 자동화 — GitHub Release publish 시 운영 서버에서 deploy.sh 실행.
# 매 릴리즈마다 사용자가 ssh + git pull + npm run build + pm2 restart 수동 진행
# 누락 → 코드/dist 불일치 → 운영 장애 위험. myFitness #137 패턴 그대로 이식.
# 스펙: docs/specs/366-deploy-automation.md
# 트리거: release.published (자동), workflow_dispatch (수동 재실행, inputs.tag 필요).

on:
  release:
    types: [published]
  # 진단/수동 재실행 트리거 — GitHub release event 가 어떤 이유로 발동 안 했을 때
  # Actions UI 의 "Run workflow" 로 수동 실행. tag 입력 (예: v0.8.3) 지정.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (예: v0.8.3)'
        required: true
        type: string

permissions:
  contents: read

# 동일 릴리즈/재시도가 겹치면 동일 worktree(node_modules/dist/pm2)에서 deploy.sh 가
# 동시 실행되어 빌드 손상/PM2 race 위험. 직렬화로 차단. 진행 중 새 release publish 시
# 새 deploy는 큐잉되어 이전 완료 후 시작.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    # 정식 릴리즈(prerelease/draft 아님) 만 운영 배포.
    # draft 는 publish 이벤트 자체가 안 뜨지만 명시적 가드.
    # workflow_dispatch 는 항상 통과 (운영자가 의도적으로 트리거).
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    steps:
      # Fingerprint secret 누락/typo 시 ssh-action 이 빈 문자열로 진행 → InsecureIgnoreHostKey
      # default → MITM 재개. 사전 검증으로 차단.
      - name: Preflight — require host fingerprint
        env:
          DEPLOY_SSH_FINGERPRINT: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
        run: |
          if [[ -z "$DEPLOY_SSH_FINGERPRINT" ]]; then
            echo "ERROR: DEPLOY_SSH_FINGERPRINT secret is empty. SSH MITM 위험 → 배포 중단." >&2
            echo "운영자: 스펙 docs/specs/366-deploy-automation.md §3.3 의 ssh-keygen -lf 명령으로 추출 후 GitHub Secrets 등록." >&2
            exit 1
          fi
          echo "Fingerprint secret present (length=${#DEPLOY_SSH_FINGERPRINT})"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          # release event 면 release.tag_name, workflow_dispatch 면 inputs.tag.
          # 직접 script에 expand 시 shell injection 위험 → env var + 형식 검증.
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          # SSH host fingerprint 검증 — 미설정 시 InsecureIgnoreHostKey() default → MITM 위험.
          # secret 등록 방법은 스펙 §3.3 참조 (ssh-keyscan + ssh-keygen -lf).
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: RELEASE_TAG,DEPLOY_PATH
          # 30분 timeout (npm ci + build + pm2 restart 충분)
          command_timeout: 30m
          script: |
            set -euo pipefail
            # 태그 형식 검증 (semver: vMAJOR.MINOR.PATCH[-suffix])
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "ERROR: Invalid tag format: $RELEASE_TAG" >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Bootstrap: 서버 working tree 의 deploy.sh 는 이전 태그 버전. 배포 흐름 자체가
            # 바뀌었다면 (v0.12.0 MCP HTTP 승격 등) checkout 후 NEW deploy.sh 를 실행해야 함.
            # git checkout 이 mcp-config.json 을 target 내용으로 바꿈 → running web/bot 이
            # 즉시 참조 → 서비스 다운 위험. Target transport (HTTP vs stdio) 별 분기:
            #   - HTTP target (v0.12.0+): checkout 전 backup → checkout 후 restore →
            #     deploy.sh 자체 backup/restore/swap 흐름 정상 동작
            #   - stdio target (rollback): target 의 stdio config 를 유지 (restore X).
            #     old deploy.sh 는 myfinance-mcp 앱을 모르므로 workflow 가 대신 정리하되,
            #     정리 시점은 deploy.sh 성공 이후 (Codex P1 #4642785947 — 실패 시 fallback 유지).
            MCP_CFG=src/lib/ai/mcp-config.json
            MCP_CFG_BOOTSTRAP=""
            if [ -f "$MCP_CFG" ]; then
              MCP_CFG_BOOTSTRAP=$(mktemp -t mcp-config.bootstrap.XXXXXX.json)
              cp "$MCP_CFG" "$MCP_CFG_BOOTSTRAP"
            fi

            git fetch origin --tags --force
            git checkout -f "$RELEASE_TAG"

            # Target transport 감지 (checkout 후의 tracked mcp-config 기준)
            IS_STDIO_TARGET=0
            if ! grep -q '"url"' "$MCP_CFG" 2>/dev/null; then
              IS_STDIO_TARGET=1
            fi

            if [ "$IS_STDIO_TARGET" = "0" ]; then
              # HTTP target — restore backup 으로 배포 중 서비스 continuity 유지
              if [ -n "$MCP_CFG_BOOTSTRAP" ] && [ -f "$MCP_CFG_BOOTSTRAP" ]; then
                cp "$MCP_CFG_BOOTSTRAP" "$MCP_CFG"
              fi
            fi
            # stdio target (rollback): target 의 stdio config 를 유지 (restore 안 함).
            # myfinance-mcp 정리는 deploy.sh 성공 이후로 지연 — Codex P1 (#4642785947):
            # old deploy.sh 는 backup/trap 복원 로직이 없어서 npm ci / build 실패 시
            # 실행 중 web/bot 은 target 의 stdio mcp-config 를 참조하지만 dist/node_modules
            # 는 partially updated → HTTP MCP 도 이미 delete 된 상태라 AI 폴백 X.
            # 지연 전략: 실패 시 in-memory myfinance-mcp (old HTTP code) 가 living
            # fallback 으로 남고, 웹/봇 도 in-memory 로는 여전히 old HTTP config 로 동작.

            ./deploy/deploy.sh "$RELEASE_TAG"

            # stdio rollback 성공 확정 후에만 myfinance-mcp 정리.
            # 실패 시 이 블록 미도달 → myfinance-mcp 유지 → 운영자 수동 확인.
            if [ "$IS_STDIO_TARGET" = "1" ]; then
              if command -v pm2 >/dev/null 2>&1 && pm2 describe myfinance-mcp >/dev/null 2>&1; then
                pm2 delete myfinance-mcp || true
                pm2 save --force || true
              fi
            fi

            # deploy.sh 성공 시 최종 swap 이 이미 수행됨. bootstrap backup 은 정리.
            [ -n "$MCP_CFG_BOOTSTRAP" ] && rm -f "$MCP_CFG_BOOTSTRAP" || true

      # 배포 결과 텔레그램 알림 — myfinance-bot 인프라 재활용. raw curl 로 third-party action 의존 X.
      # 토큰은 GitHub Actions가 자동 마스킹. 성공/실패 모두 알림 (무알림이 더 위험).
      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # release event 는 body 를 payload 에 담고 있음. workflow_dispatch 는 없음 → gh 로 폴백.
          RELEASE_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret 미설정 — 알림 skip"
            exit 0
          fi

          # 릴리스 본문 확보 — release event 면 payload, 아니면 gh 로 조회.
          notes_raw="${RELEASE_BODY:-}"
          if [[ -z "$notes_raw" ]]; then
            notes_raw=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body -q .body 2>/dev/null || true)
          fi

          # 마크다운 노이즈 제거 → HTML 이스케이프. sed 순서: **bold** / ## 헤더 / 백틱 제거 / \/ \` 언이스케이프 후 HTML 이스케이프.
          # ERE (-E) 로 헤더 매칭 (\+ 는 GNU/BSD sed 호환성 이슈). head -c 800 로 트림, 길이 비교로 잘림 감지.
          processed=$(printf '%s' "$notes_raw" \
            | sed -E -e 's/\\([`/])/\1/g' -e 's/\*\*//g' -e 's/^#+ //' -e 's/`//g' \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          notes=$(printf '%s' "$processed" | head -c 800)
          if [[ ${#notes} -lt ${#processed} ]]; then
            notes="${notes}…"
          fi

          # printf 로 \n literal newline 처리 — multi-line YAML block scalar 들여쓰기 깨짐 회피.
          if [[ -n "$notes" ]]; then
            text=$(printf '✅ <b>myFinance Deploy %s</b> 성공\n서버: production\n\n<b>변경 내역</b>\n%s\n\n워크플로우: %s' "$RELEASE_TAG" "$notes" "$RUN_URL")
          else
            text=$(printf '✅ <b>myFinance Deploy %s</b> 성공\n서버: production\n워크플로우: %s' "$RELEASE_TAG" "$RUN_URL")
          fi

          # 성공 응답 body (sent message + chat metadata) 는 chat 정보 노출 위험 → /tmp 로 격리.
          # 실패 (HTTP 4xx/5xx) 시에만 body 출력 + step fail (--fail-with-body).
          body=$(mktemp)
          if ! curl -sS --fail-with-body -o "$body" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$text"; then
            echo "::error::Telegram sendMessage failed"
            cat "$body" >&2
            rm -f "$body"
            exit 1
          fi
          rm -f "$body"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret 미설정 — 알림 skip"
            exit 0
          fi
          text=$(printf '❌ <b>myFinance Deploy %s</b> 실패\n워크플로우 로그: %s' "${RELEASE_TAG:-unknown}" "$RUN_URL")
          # 실패 알림 자체가 또 실패해도 가시화. 성공 body 는 chat 정보 노출 위험 → /tmp 격리.
          body=$(mktemp)
          if ! curl -sS --fail-with-body -o "$body" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$text"; then
            echo "::error::Telegram failure notification itself failed"
            cat "$body" >&2
            rm -f "$body"
            exit 1
          fi
          rm -f "$body"
